version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: rb-postgres
    environment:
      POSTGRES_DB: resource_booking
      POSTGRES_USER: rb_admin
      POSTGRES_PASSWORD: RbAdminPassword2026
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rb_admin -d resource_booking"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: rb-backend
    ports:
      - "8080:8080"
    environment:
      # These overwrite the fallbacks in your application.yml
      SPRING_PROFILES_ACTIVE: dev
      DATABASE_URL: jdbc:postgresql://postgres:5432/resource_booking
      DATABASE_USER: rb_admin
      DATABASE_PASSWORD: RbAdminPassword2026
      # Set a strong JWT secret for the Docker environment
      JWT_SECRET: bXlTdXBlclNlY3VyZUpXVFNlY3JldEtleUZvclJlc291cmNlQm9va2luZ1N5c3RlbQ==
      JPA_DDL_AUTO: update
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data: